# Telegraf Configuration for Cisco 3750X Switch and Brother Printer

# Global Agent Configuration
[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  hostname = ""
  omit_hostname = false
  skip_processors_after_aggregators = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

[[outputs.influxdb]]
  urls = ["http://10.30.0.41:8086"]
  database = "homeassistant"
  username = "hass"
  password = "hass123"
  skip_database_creation = false
  timeout = "10s"

###############################################################################
#                            PROCESSOR PLUGINS                                #
###############################################################################

[[processors.starlark]]
  namepass = ["brother_printer"]
  source = '''
def apply(metric):
    # Parse brInfoCounter for page counts
    counter_data = metric.fields.get("brInfoCounter")
    if counter_data != None:
        hex_clean = str(counter_data).replace(" ", "").replace("0x", "")
        data_bytes = []
        # Convert hex string to bytes using for loop (Starlark doesn't support while)
        for idx in range(len(hex_clean) // 2):
            i = idx * 2
            if i + 2 <= len(hex_clean):
                data_bytes.append(int(hex_clean[i:i+2], 16))
        
        # Parse the byte array for page counts
        for i in range(len(data_bytes) - 6):
            if i + 6 < len(data_bytes):
                if data_bytes[i+1] == 1 and data_bytes[i+2] == 4:
                    val = (data_bytes[i+3] * 16777216) + (data_bytes[i+4] * 65536) + (data_bytes[i+5] * 256) + data_bytes[i+6]
                    
                    if data_bytes[i] == 0:
                        metric.fields["page_count_total_parsed"] = float(val)
                    elif data_bytes[i] == 1:
                        metric.fields["page_count_color"] = float(val)
                    elif data_bytes[i] == 2:
                        metric.fields["page_count_bw"] = float(val)
    
    # Parse brInfoMaintenance for drum percentages
    maint_data = metric.fields.get("brInfoMaintenance")
    if maint_data != None:
        hex_clean = str(maint_data).replace(" ", "").replace("0x", "")
        data_bytes = []
        # Convert hex string to bytes using for loop (Starlark doesn't support while)
        for idx in range(len(hex_clean) // 2):
            i = idx * 2
            if i + 2 <= len(hex_clean):
                data_bytes.append(int(hex_clean[i:i+2], 16))
        
        # Parse the byte array for drum percentages
        for i in range(len(data_bytes) - 6):
            if i + 6 < len(data_bytes):
                if data_bytes[i+1] == 1 and data_bytes[i+2] == 4:
                    # Last byte contains percentage value
                    val = float(data_bytes[i+6])
                    
                    if data_bytes[i] == 0x82:
                        metric.fields["drum_black_percent"] = val
                    elif data_bytes[i] == 0x83:
                        metric.fields["drum_cyan_percent"] = val
                    elif data_bytes[i] == 0x84:
                        metric.fields["drum_magenta_percent"] = val
                    elif data_bytes[i] == 0x81:
                        metric.fields["drum_yellow_percent"] = val
    
    return metric
'''

