function bTax(i,b){let t=0;for(const x of b){if(i<=x.min)break;t+=(Math.min(i,x.max)-x.min)*x.rate}return t}
function hp(i){if(i<=20000)return 0;if(i<=25000)return Math.min((i-20000)*.06,300);if(i<=36000)return 300;if(i<=38500)return Math.min(300+(i-36000)*.06,450);if(i<=48000)return 450;if(i<=48600)return Math.min(450+(i-48000)*.25,600);if(i<=72000)return 600;if(i<=72600)return Math.min(600+(i-72000)*.25,750);if(i<=200000)return 750;if(i<=200600)return Math.min(750+(i-200000)*.25,900);return 900}
function calc(yr,t4s,rc,fc){
const d=TD[yr],gr=t4s.reduce((s,t)=>s+(t.b14||0),0);
const tCpp=t4s.reduce((s,t)=>s+(t.b16||0),0),tC2=t4s.reduce((s,t)=>s+(t.b166||0),0),tEi=t4s.reduce((s,t)=>s+(t.b18||0),0),tTd=t4s.reduce((s,t)=>s+(t.b22||0),0);

const co=hd?Math.max(tCpp-c1,0):0,c2o=hd?Math.max(tC2-c2,0):0,eo=hd?Math.max(tEi-ei,0):0,to=co+c2o+eo;

let fr=0,onr=0;for(const b of d.federal.brackets)if(ti>b.min)fr=b.rate;for(const b of d.ontario.brackets)if(ti>b.min)onr=b.rate;
let sm=1;if(bo>d.ontario.s36)sm=1.56;else if(bo>d.ontario.s20)sm=1.2;
return{gr,ti,ar,af,rr,cd,c1,c2,ei,tp:c1+c2+ei,tCpp,tC2,tEi,tTd,hd,co,c2o,eo,to,ft,fb,fc2:fc2,fcp,fe,ftc,nf,ot,otc,bo,st,no,h,tt,ni,eff:gr>0?(tt/gr)*100:0,mr:((fr+onr*sm)*100).toFixed(2),ref:hd?tTd-tt+to:null,bc}}
