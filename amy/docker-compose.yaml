# !! IMPORTANT - DO NOT MODIFY PORTS OR TSDPROXY NAMES !!
# These are LOCKED production values. Any changes require explicit approval.
# ============================================
# OPEN ITEMS, flagged not changed:
#   - postgres-backup lists "stirling" in POSTGRES_DB, but stirling has no
#     database environment variables and keeps an H2 file at
#     /docker/stirling/configs/stirling-pdf-DB-*.mv.db. So that entry
#     probably fails nightly. Check the postgres-backup logs.
#   - mealie uses BASE_URL=https://mealie.${TAILSCALE_DOMAIN}. That is the
#     pattern that broke vikunja's sessions on bender, fixed in v114 by
#     matching the browsed origin. Expect the same fault if mealie is
#     reached by a LAN name.
#   - keepalived mounts to /etc/keepalived/keepalived.conf here, but bender
#     mounts to /container/service/keepalived/assets/keepalived.conf with
#     command: --copy-service. Both work, by different mechanisms.
#   - log rotation is not configured. A tsdproxy error loop produced a
#     211 MB json log on 2026-08-08. The fix is max-size and max-file in
