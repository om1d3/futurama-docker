  # LOCKED tsdproxy.name: "home" - DO NOT CHANGE
  # LOCKED PORT: 3003:3000 - DO NOT CHANGE
  # 20260810: mount CHANGED from /docker/homepage/config to /docker/homepage
  #   REASON: the authored files (services.yaml, bookmarks.yaml,
  #   widgets.yaml, docker.yaml, proxmox.yaml, custom.css, custom.js) sit in
  #   /docker/homepage. The config/ subdirectory held only kubernetes.yaml
  #   and settings.yaml, which look like generated defaults.
  #   VERIFY: if the dashboard previously showed your tiles, revert this
  #   line. Homepage was then reading them another way.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "home"
      tsdproxy.container_port: "3000"
      tsdproxy.dash.icon: "mdi/home"
    environment:
      - TZ=${TIMEZONE}
      # 20260810.2: REQUIRED. homepage refuses any Host header not listed
      # here. Only localhost:3000 and 127.0.0.1:3000 are allowed by
      # default. Add an entry for every way homepage is reached.
      - HOMEPAGE_ALLOWED_HOSTS=10.30.0.11:3003,home.arpa:3003,home.bunny-enigmatic.ts.net
    volumes:
      - /docker/homepage:/app/config
      - /docker/homepage/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3003:3000"
    networks:
      - utility-network

