# DNS anchor for all services on utility-network
x-dns: &default-dns
  dns:
    - 10.30.0.2

services:

  # ============================================
  # INFRASTRUCTURE
  # ============================================

  # LOCKED tsdproxy.name: "amy-proxy" - DO NOT CHANGE
  # LOCKED PORT: 8085:8080 - DO NOT CHANGE
  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v94: removed wget healthcheck (not available in container)
  # v101: added TSNET_FORCE_LOGIN=1
  # v104: added TS_AUTHKEY to fix tsnet re-auth after reboot
  # 20260810: pinned to a digest. :latest resolves to 3.0.0-beta.1.
  #   NOTE: the Tailscale auth key exists in THREE places that must agree -
  #   TSDPROXY_AUTHKEY and TS_AUTHKEY in .env, and authKey in
  #   /docker/tsdproxy/config/tsdproxy.yaml. The v3 beta reads the yaml.
  #   NOTE: /portainer/tsdproxy/ is a DECOY from the Portainer era. It looks
  #   plausible and nothing reads it. The live path is /docker/tsdproxy/.
  tsdproxy:
    image: almeidapaulopt/tsdproxy@sha256:e75357d559066a6d0a8242b6d64f8e295adfa6024d3cf1c9a3e3f1ecb00c0bb1
    container_name: tsdproxy
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "amy-proxy"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/tailscale"
    environment:
      - TSDPROXY_AUTHKEY=${TSDPROXY_AUTHKEY}
      - TS_AUTHKEY=${TSDPROXY_AUTHKEY}
      - TSDPROXY_HOSTNAME=${AMY_HOST_IP}
      - TSDPROXY_DATADIR=/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TSNET_FORCE_LOGIN=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /docker/tsdproxy/data:/data
      - /docker/tsdproxy/config:/config
    ports:
      - "8085:8080"
    networks:
      - utility-network

  # LOCKED tsdproxy.name: "amy-dockwatch" - DO NOT CHANGE
  # LOCKED PORT: 9999:80 - DO NOT CHANGE
  dockwatch:
    image: ghcr.io/notifiarr/dockwatch:main
    container_name: dockwatch
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "amy-dockwatch"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/docker-dark"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /docker/dockwatch:/config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:80"
    networks:
      - utility-network

  # LOCKED tsdproxy.name: "logs" - DO NOT CHANGE
  # LOCKED PORT: 8182:8080 - DO NOT CHANGE
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "logs"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/dozzle"
    environment:
      - DOZZLE_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8182:8080"
    networks:
      - utility-network

  # ============================================
  # NETWORK CONFIG BACKUP
  # ============================================

  # v102: Oxidized - Automated nod config backup to GitHub
  # Backs up nod (Cisco Catalyst 3750X) running config hourly
  # Config: /docker/oxidized/config
  # Device list: /docker/oxidized/router.db
  # GitHub repo: https://github.com/om1d3/nod-config (private)
  # REST API available at http://10.30.0.11:8889
  # 20260810: PINNED to 0.36.0. Do NOT move to 0.37.0 - it passes
  #   max_window_size to Net::SSH.start and net-ssh 7.3.0 rejects it, so
  #   every fetch dies with ArgumentError. Check the crash files at
  #   /docker/oxidized/crashes/ before changing this pin.
  # NOTE: the config file holds a GitHub PAT and nod's credentials in
  #   plaintext. It is an early candidate for the SOPS layer.
  # LOCKED PORT: 8889:8888 - DO NOT CHANGE
  oxidized:
    image: oxidized/oxidized:0.36.0
    container_name: oxidized
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
      - CONFIG_RELOAD_INTERVAL=3600
    volumes:
      - /docker/oxidized:/home/oxidized/.config/oxidized
    ports:
      - "8889:8888"
    networks:
      - utility-network

  # ============================================
  # DNS & HIGH AVAILABILITY
  # ============================================

  # LOCKED tsdproxy.name: "pihole-amy" - DO NOT CHANGE
  # LOCKED PORT: 53:53, 8053:80 - DO NOT CHANGE
  # NOTE: pihole does NOT use default-dns (it IS the DNS server)
  # 20260810: healthcheck added, matching bender
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "pihole-amy"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/pi-hole"
    environment:
      - TZ=${TIMEZONE}
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - PIHOLE_DNS_=9.9.9.9;1.1.1.1
      - DNSSEC=true
      - REV_SERVER=true
      - REV_SERVER_DOMAIN=lan
      - REV_SERVER_TARGET=10.30.0.1
      - REV_SERVER_CIDR=10.30.0.0/24
      - FTLCONF_LOCAL_IPV4=10.30.0.11
    volumes:
      - /docker/pihole/etc-pihole:/etc/pihole
      - /docker/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"
    networks:
      - utility-network
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "dig", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # KEEPALIVED - High Availability VIP (BACKUP role)
  # NOTE: keepalived uses network_mode: host, so no DNS config needed
  # 20260810.2: PINNED BY DIGEST to what runs, keepalived 2.3.4.
  #   Do NOT pin to the 2.0.20 tag. That version reads its config from
  #   /usr/local/etc/keepalived/keepalived.conf, not /etc/keepalived/,
  #   so it ignores this mount and enters a restart loop.
  # NOTE: the mount target differs from bender, which uses
  #   /container/service/keepalived/assets/keepalived.conf with
  #   command: --copy-service. Both mechanisms work.
  # NOTE: keepalived.conf holds auth_pass in plaintext. VRRP requires the
  #   same secret on both peers, so a rotation must edit both files and
  #   restart the BACKUP first, then the MASTER.
  keepalived:
    image: osixia/keepalived@sha256:190269186850de7b2892129691a3ddea4c1aa27ed8fa4f2c3e1ad770251ffd39
    container_name: keepalived
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    network_mode: host
    labels:
      tsdproxy.enable: "false"
    volumes:
      - /docker/keepalived/keepalived.conf:/etc/keepalived/keepalived.conf

  # ============================================
  # DATABASES
  # ============================================

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v94: fixed volume path to /portainer/postgresql/data, removed healthcheck
  # v94: fixed MINIFLUX_ADMIN_USERNAME variable name
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - /portainer/postgresql/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - utility-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # NOTE: POSTGRES_DB lists "stirling", but stirling has no database
  #   environment variables and keeps an H2 file in its own config
  #   directory. That entry probably fails every night. Verify with
  #   docker logs postgres-backup before removing it.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: postgres-backup
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=atuin,miniflux,sss,mealie,stirling
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - TZ=${TIMEZONE}
    volumes:
      - /docker/postgres-backup:/backups
    networks:
      - utility-network
    depends_on:
      postgres:
        condition: service_healthy

  # LOCKED PORT: 6379:6379 - DO NOT CHANGE
  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    command: valkey-server --appendonly yes
    volumes:
      - /docker/valkey:/data
    ports:
      - "6379:6379"
    networks:
      - utility-network

  # ============================================
  # NOTIFICATIONS
  # ============================================

  # LOCKED tsdproxy.name: "ntfy" - DO NOT CHANGE
  # LOCKED PORT: 8888:80 - DO NOT CHANGE
  # NOTE: this is the notification endpoint for bender's diun, bender's
  #   audiobook-foundry, secure-container-update.sh on both hosts, and
  #   bender-replicate.sh. Topics in use include container-updates-bender,
  #   tts-pipeline and bender-backup. Subscribe to ALL of them - four
  #   high-priority backup failures went unseen in July because the
  #   bender-backup topic had no subscriber.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "ntfy"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/ntfy"
    command: serve
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - /docker/ntfy/cache:/var/cache/ntfy
      - /docker/ntfy/etc:/etc/ntfy
    ports:
      - "8888:80"
    networks:
      - utility-network

  # ============================================
  # PRODUCTIVITY
  # ============================================

  # LOCKED tsdproxy.name: "pdf" - DO NOT CHANGE
  # LOCKED PORT: 8080:8080 - DO NOT CHANGE
  # ✅ VERIFIED WORKING 2026-02-02 - DO NOT MODIFY WITHOUT APPROVAL
