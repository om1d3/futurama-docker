#     DNS never failed, because bender holds the VIP as MASTER.
#   - PINNED: keepalived by digest instead of by tag.
#     osixia/keepalived@sha256:190269186850de7b2892129691a3ddea4c1aa27ed8fa4f2c3e1ad770251ffd39
#     A digest freezes what actually runs, 2.3.4, and needs no trust in a
#     tag name. Same approach as tsdproxy.
#     NOTE: amy and bender now run different keepalived versions by
#     different mechanisms. VRRP is a protocol, so 2.3.4 and 2.0.20
#     interoperate correctly. Version parity would require changing amy's
#     mount path as well, which is a real change and not a no-op.
#     VERIFIED: log shows "(PIHOLE_VIP) Entering BACKUP STATE (init)" and
#     "VRRP_Script(chk_pihole) succeeded". amy does not hold the VIP.
#   - ADDED: HOMEPAGE_ALLOWED_HOSTS to homepage.
#     REASON: homepage 16.2.6 refuses any request whose Host header is not
#     in that list. Only localhost:3000 and 127.0.0.1:3000 are allowed by
#     default. Every access returned "Host validation failed. See logs for
#     more details." Three entries are required, because homepage is
#     reached three ways: by IP, by LAN name through Pi-hole, and by
