# ============================================
# amy (Intel i3-2310M, 16GB RAM) - Utilities & Services
# Version: 98 - Consolidated Telegraf into main docker-compose
# ============================================
# Host: Intel i3-2310M
# IP: 192.168.21.130
# RAM: 16GB
# Data path: /docker/
# ============================================
# v91 CHANGES (2026-01-19):
#   - REMOVED unapproved lubelogger SMTP config (MailConfig__* variables)
#   - Restored lubelogger to minimal v84-style configuration
# v92 CHANGES (2026-01-19):
#   - MOVED vaultwarden to bender (user requested migration)
# v93 CHANGES (2026-01-19):
#   - ADDED dns: 192.168.21.100 to all services on utility-network
#   - Uses keepalived VIP for local DNS resolution
# v94 CHANGES (2026-01-20):
#   - FIXED postgres volume path from /docker/postgres/data to /portainer/postgresql/data
#   - This restores access to existing databases (atuin, miniflux, sss, mealie)
# v95 CHANGES (2026-01-20):
#   - ADDED /docker/spendspentspent/config:/config volume mount to spendspentspent
#   - Ensures config persists across container recreations
# v96 CHANGES (2026-01-20):
#   - ADDED verification comments to all fixed services
#   - FIXED stirling image from frooodle/s-pdf:latest to stirlingtools/stirling-pdf:latest
#   - FIXED netalertx volume mount and added required capabilities
#   - FIXED mealie image from hkotel/mealie:latest to ghcr.io/mealie-recipes/mealie:latest
# v97 CHANGES (2026-02-06):
#   - ADDED SYSTEM_MAXDPI=1200 to stirling environment variables
#   - Fixes "DPI value 300 exceeds maximum safe limit of 0" error
# v98 CHANGES (2026-02-07):
#   - ADDED telegraf service (consolidated from /portainer/telegraf/docker-compose.yml)
#   - Telegraf monitors Cisco 3750X switch and Brother MFC-L3710CW printer via SNMP
#   - Uses existing config at /portainer/telegraf/config/telegraf.conf
# ============================================
# ✅ VERIFIED WORKING SERVICES - DO NOT MODIFY WITHOUT APPROVAL:
#   - postgres (v94: fixed volume path, removed healthcheck)
#   - spendspentspent (v95: added /config mount, v86: fixed /files mount, SSS_SALT)
#   - miniflux (v94: fixed MINIFLUX_ADMIN_USERNAME)
#   - mealie (v85.3: migrated to PostgreSQL, v94: Python healthcheck, v96: fixed image)
#   - filebrowser (v94: removed curl healthcheck, fixed volume paths)
#   - tsdproxy (v94: removed wget healthcheck)
#   - argus (v85.3: fixed image to releaseargus/argus:latest)
#   - limdius (v85.3: fixed image to python:3.11-slim)
#   - lubelogger (v91: removed unauthorized SMTP config)
#   - stirling (v96: fixed image to stirlingtools/stirling-pdf:latest, v97: added SYSTEM_MAXDPI)
#   - All services (v93: added DNS anchor 192.168.21.100)
# ============================================
# !! DO NOT REMOVE WATCHTOWER - Keep as fallback !!
# ============================================
# !! IMPORTANT - DO NOT MODIFY PORTS OR TSDPROXY NAMES !!
# These are LOCKED production values. Any changes require explicit approval.
# ============================================

# DNS anchor for all services on utility-network
x-dns: &default-dns
  dns:
    - 192.168.21.100

services:

  # ============================================
  # INFRASTRUCTURE
  # ============================================

  # LOCKED tsdproxy.name: "amy-proxy" - DO NOT CHANGE
  # LOCKED PORT: 8085:8080 - DO NOT CHANGE
  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v94: removed wget healthcheck (not available in container)
  tsdproxy:
    image: almeidapaulopt/tsdproxy:latest
    container_name: tsdproxy
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "amy-proxy"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/tsdproxy"
    environment:
      - TSDPROXY_AUTHKEY=${TSDPROXY_AUTHKEY}
      - TSDPROXY_HOSTNAME=${AMY_HOST_IP}
      - TSDPROXY_DATADIR=/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /docker/tsdproxy/data:/data
      - /docker/tsdproxy/config:/config
    ports:
      - "8085:8080"
    networks:
      - utility-network

  # LOCKED tsdproxy.name: "amy-dockwatch" - DO NOT CHANGE
  # LOCKED PORT: 9999:80 - DO NOT CHANGE
  dockwatch:
    image: ghcr.io/notifiarr/dockwatch:main
    container_name: dockwatch
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "amy-dockwatch"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/dockwatch"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /docker/dockwatch:/config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:80"
    networks:
      - utility-network

  # LOCKED tsdproxy.name: "logs" - DO NOT CHANGE
  # LOCKED PORT: 8182:8080 - DO NOT CHANGE
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "logs"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/dozzle"
    environment:
      - DOZZLE_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8182:8080"
    networks:
      - utility-network

  # ============================================
  # DNS & HIGH AVAILABILITY
  # ============================================

  # LOCKED tsdproxy.name: "pihole-amy" - DO NOT CHANGE
  # LOCKED PORT: 53:53, 8053:80 - DO NOT CHANGE
  # NOTE: pihole does NOT use default-dns (it IS the DNS server)
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "pihole-amy"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/pi-hole"
    environment:
      - TZ=${TIMEZONE}
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - PIHOLE_DNS_=9.9.9.9;1.1.1.1
      - DNSSEC=true
      - REV_SERVER=true
      - REV_SERVER_DOMAIN=lan
      - REV_SERVER_TARGET=192.168.21.1
      - REV_SERVER_CIDR=192.168.21.0/24
      - FTLCONF_LOCAL_IPV4=192.168.21.130
    volumes:
      - /docker/pihole/etc-pihole:/etc/pihole
      - /docker/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"
    networks:
      - utility-network
    cap_add:
      - NET_ADMIN

  # KEEPALIVED - High Availability VIP (BACKUP role)
  # NOTE: keepalived uses network_mode: host, so no DNS config needed
  keepalived:
    image: osixia/keepalived:latest
    container_name: keepalived
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    network_mode: host
    labels:
      tsdproxy.enable: "false"
    volumes:
      - /docker/keepalived:/container/service/keepalived/assets

  # ============================================
  # DATABASES
  # ============================================

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v94: fixed volume path to /portainer/postgresql/data, removed healthcheck
  # v94: fixed MINIFLUX_ADMIN_USERNAME variable name
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - /portainer/postgresql/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - utility-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: postgres-backup
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=atuin,miniflux,sss,mealie,stirling
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - TZ=${TIMEZONE}
    volumes:
      - /docker/postgres-backup:/backups
    networks:
      - utility-network
    depends_on:
      postgres:
        condition: service_healthy

  # LOCKED PORT: 6379:6379 - DO NOT CHANGE
  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    command: valkey-server --appendonly yes
    volumes:
      - /docker/valkey:/data
    ports:
      - "6379:6379"
    networks:
      - utility-network

  # ============================================
  # NOTIFICATIONS
  # ============================================

  # LOCKED tsdproxy.name: "ntfy" - DO NOT CHANGE
  # LOCKED PORT: 8888:80 - DO NOT CHANGE
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "ntfy"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/ntfy"
    command: serve
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - /docker/ntfy/cache:/var/cache/ntfy
      - /docker/ntfy/etc:/etc/ntfy
    ports:
      - "8888:80"
    networks:
      - utility-network

  # ============================================
  # PRODUCTIVITY
  # ============================================

  # LOCKED tsdproxy.name: "pdf" - DO NOT CHANGE
  # LOCKED PORT: 8080:8080 - DO NOT CHANGE
  # ✅ VERIFIED WORKING 2026-02-02 - DO NOT MODIFY WITHOUT APPROVAL
  # v96: fixed image from frooodle/s-pdf:latest to stirlingtools/stirling-pdf:latest
  # v97: added SYSTEM_MAXDPI=1200 to fix DPI limit error
  stirling:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "pdf"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/stirling-pdf"
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - LANGS=en_US
      - SYSTEM_MAXDPI=1200
    volumes:
      - /docker/stirling/trainingData:/usr/share/tessdata
      - /docker/stirling/configs:/configs
      - /docker/stirling/logs:/logs
    ports:
      - "8080:8080"
    networks:
      - utility-network

  # LOCKED tsdproxy.name: "home" - DO NOT CHANGE
  # LOCKED PORT: 3003:3000 - DO NOT CHANGE
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "home"
      tsdproxy.container_port: "3000"
      tsdproxy.dash.icon: "sh/homepage"
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - /docker/homepage/config:/app/config
      - /docker/homepage/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3003:3000"
    networks:
      - utility-network

  # LOCKED tsdproxy.name: "atuin" - DO NOT CHANGE
  # LOCKED PORT: 8777:8888 - DO NOT CHANGE
  atuin:
    image: ghcr.io/atuinsh/atuin:latest
    container_name: atuin
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "atuin"
      tsdproxy.container_port: "8888"
      tsdproxy.dash.icon: "sh/atuin"
    command: server start
    environment:
      - ATUIN_HOST=0.0.0.0
      - ATUIN_PORT=8888
      - ATUIN_OPEN_REGISTRATION=false
      - ATUIN_DB_URI=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/atuin
      - RUST_LOG=info
    ports:
      - "8777:8888"
    networks:
      - utility-network
    depends_on:
      postgres:
        condition: service_healthy

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v94: fixed MINIFLUX_ADMIN_USERNAME variable name
  miniflux:
    image: miniflux/miniflux:latest
    container_name: miniflux
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "rss"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/miniflux"
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${MINIFLUX_ADMIN_USERNAME}
      - ADMIN_PASSWORD=${MINIFLUX_ADMIN_PASSWORD}
    ports:
      - "8385:8080"
    networks:
      - utility-network
    depends_on:
      postgres:
        condition: service_healthy

  # LOCKED tsdproxy.name: "it-tools" - DO NOT CHANGE
  # LOCKED PORT: 8181:80 - DO NOT CHANGE
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "it-tools"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/it-tools"
    ports:
      - "8181:80"
    networks:
      - utility-network

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v94: removed curl healthcheck (not available in container), fixed volume paths
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "files"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/filebrowser"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /docker/filebrowser/database:/database
      - /docker/filebrowser/config:/config
      - /docker:/srv/docker
      - /portainer:/srv/portainer
    ports:
      - "8082:80"
    networks:
      - utility-network

  # LOCKED tsdproxy.name: "wallos" - DO NOT CHANGE
  # LOCKED PORT: 8283:80 - DO NOT CHANGE
  wallos:
    image: bellamy/wallos:latest
    container_name: wallos
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "wallos"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/wallos"
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - /docker/wallos/db:/var/www/html/db
    ports:
      - "8283:80"
    networks:
      - utility-network

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v85.3: migrated to PostgreSQL, v94: Python healthcheck
  # v96: fixed image from hkotel/mealie:latest to ghcr.io/mealie-recipes/mealie:latest
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "mealie"
      tsdproxy.container_port: "9000"
      tsdproxy.dash.icon: "sh/mealie"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      - BASE_URL=https://mealie.${TAILSCALE_DOMAIN}
      - DB_ENGINE=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealie
    volumes:
      - /docker/mealie:/app/data
    ports:
      - "8456:9000"
    networks:
      - utility-network
    depends_on:
      postgres:
        condition: service_healthy

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v85.3: fixed image to releaseargus/argus:latest
  argus:
    image: releaseargus/argus:latest
    container_name: argus
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "argus"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/argus"
    volumes:
      - /docker/argus:/app/data
    ports:
      - "8282:8080"
    networks:
      - utility-network

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v91: removed unauthorized SMTP config
  lubelogger:
    image: ghcr.io/hargata/lubelogger:latest
    container_name: lubelogger
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "lube"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/lubelogger"
    environment:
      - TZ=${TIMEZONE}
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
    volumes:
      - /docker/lubelogger/config:/App/config
      - /docker/lubelogger/data:/App/data
      - /docker/lubelogger/temp:/App/wwwroot/temp
      - /docker/lubelogger/log:/App/log
      - /docker/lubelogger/keys:/root/.aspnet/DataProtection-Keys
      - /docker/lubelogger/documents:/App/wwwroot/documents
    ports:
      - "8989:8080"
    networks:
      - utility-network

  # ============================================
  # FINANCE
  # ============================================

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v95: added /config mount, v86: fixed /files mount, SSS_SALT variable
  # LOCKED tsdproxy.name: "money" - DO NOT CHANGE
  # LOCKED PORT: 9021:9001 - DO NOT CHANGE
  spendspentspent:
    image: gonzague/spendspentspent:latest
    container_name: spendspentspent
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "money"
      tsdproxy.container_port: "9001"
      tsdproxy.dash.icon: "sh/spendspentspent"
    environment:
      - TZ=${TIMEZONE}
      - TIMEZONE=${TIMEZONE}
      - SALT=${SSS_SALT}
      - DB_PATH=jdbc:postgresql://postgres:5432/sss
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - PLAYWRIGHT_URL=ws://playwright-chrome:3000
      - ALLOW_SIGNUP=0
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/spendspentspent/app-files:/app-files
      - /docker/spendspentspent/files:/files
      - /docker/spendspentspent/config:/config
    ports:
      - "9021:9001"
    networks:
      - utility-network
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # AUTOMATION & SUPPORT
  # ============================================

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v85.3: fixed image to python:3.11-slim
  limdius:
    image: python:3.11-slim
    container_name: limdius
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "limdius"
      tsdproxy.container_port: "5050"
    environment:
      - TZ=${TIMEZONE}
      - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000
    volumes:
      - /docker/limdius:/app
    working_dir: /app
    ports:
      - "5050:5050"
    networks:
      - utility-network
    command: >
      sh -c "pip install --no-cache-dir requests flask playwright &&
             python -u /app/limdius.py"

  playwright-chrome:
    image: browserless/chrome:latest
    container_name: playwright-chrome
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=300000
      - MAX_QUEUE_LENGTH=10
    ports:
      - "3100:3000"
    networks:
      - utility-network

  # ============================================
  # MONITORING
  # ============================================

  # LOCKED tsdproxy.name: "beszel" - DO NOT CHANGE
  # LOCKED PORT: 8090:8090 - DO NOT CHANGE
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "beszel"
      tsdproxy.container_port: "8090"
      tsdproxy.dash.icon: "sh/beszel"
    volumes:
      - /docker/beszel/data:/beszel_data
    ports:
      - "8090:8090"
    networks:
      - utility-network

  # NOTE: beszel-agent uses network_mode: host, so no DNS config needed
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    labels:
      tsdproxy.enable: "false"
    environment:
      - KEY=${BESZEL_KEY}
      - PORT=45876
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # LOCKED tsdproxy.name: "cadvisor" - DO NOT CHANGE
  # LOCKED PORT: 9099:8080 - DO NOT CHANGE
  # v98: Added resource-saving flags (docker_only, reduced housekeeping, disabled unused metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "cadvisor"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/cadvisor"
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "9099:8080"
    networks:
      - utility-network

  # NOTE: netalertx uses network_mode: host, so no DNS config needed
  # ✅ FIXED 2026-02-02 - Updated volume mount and added required capabilities
  netalertx:
    image: jokobsk/netalertx:latest
    container_name: netalertx
    restart: unless-stopped
    network_mode: host
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "netalertx"
      tsdproxy.container_port: "20211"
      tsdproxy.dash.icon: "sh/netalertx"
    environment:
      - TZ=${TIMEZONE}
      - PORT=20211
    volumes:
      - /docker/netalertx/data:/data
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE

  # v98: Consolidated from /portainer/telegraf/docker-compose.yml
  # Monitors Cisco 3750X switch and Brother MFC-L3710CW printer via SNMP
  # Config: /portainer/telegraf/config/telegraf.conf
  # NOTE: telegraf uses network_mode: host, so no DNS config needed
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    network_mode: host
    labels:
      tsdproxy.enable: "false"
    volumes:
      - /portainer/telegraf/config/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - TZ=${TIMEZONE}

  # ============================================
  # UPDATE & SECURITY TOOLS
  # ============================================

  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    command: serve
    environment:
      - TZ=${TIMEZONE}
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 4 * * 3
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_NTFY_ENDPOINT=http://ntfy:80
      - DIUN_NOTIF_NTFY_TOPIC=${DIUN_NTFY_TOPIC}
    volumes:
      - /docker/diun/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - utility-network

  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    command: server --listen 0.0.0.0:4954
    environment:
      - TRIVY_CACHE_DIR=/tmp/trivy
    volumes:
      - /docker/trivy/cache:/tmp/trivy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8083:4954"
    networks:
      - utility-network

  # ============================================
  # !! DO NOT REMOVE WATCHTOWER - Keep as fallback !!
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: watchtower
  #   restart: unless-stopped
  #   network_mode: host
  #   labels:
  #     tsdproxy.enable: "false"
  #   environment:
  #     - TZ=${TIMEZONE}
  #     - WATCHTOWER_CLEANUP=true
  #     - WATCHTOWER_INCLUDE_STOPPED=true
  #     - WATCHTOWER_POLL_INTERVAL=86400
  #     - WATCHTOWER_NOTIFICATIONS=shoutrrr
  #     - WATCHTOWER_NOTIFICATION_URL=ntfy://ntfy:80/watchtower?scheme=http
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

# ============================================
# NETWORKS
# ============================================
networks:
  utility-network:
    driver: bridge
