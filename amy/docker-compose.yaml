#     2026-06-10 until the pin. A stale /tmp/oxidized.pid then held the
#     container in a restart loop.
#     The edit was applied by hand and is recorded here for the first time.
#   - ADDED: profiles: ["parked"] to six services that are intentionally
#     stopped: limdius, lubelogger, playwright-chrome, spendspentspent,
#     tax-calculator, wallos.
#     REASON: they were stopped by hand on 2026-08-08, so every
