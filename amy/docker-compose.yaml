  # ============================================
  # AUTOMATION & SUPPORT
  # ============================================

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v85.3: fixed image to python:3.11-slim
  # 20260810: PARKED. Intentionally stopped on 2026-08-08.
  # NOTE: the container installs its Python dependencies at every start and
  #   runs /docker/limdius/limdius.py from the mount. That script is
  #   authored code and belongs in a backup scope.
  limdius:
    image: python:3.11-slim
    container_name: limdius
    restart: unless-stopped
    <<: *default-dns
    profiles: ["parked"]
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "limdius"
      tsdproxy.container_port: "5050"
    environment:
      - TZ=${TIMEZONE}
      - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000
    volumes:
      - /docker/limdius:/app
    working_dir: /app
    ports:
      - "5050:5050"
    networks:
      - utility-network
    command: >
      sh -c "pip install --no-cache-dir requests flask playwright &&
             python -u /app/limdius.py"

  # 20260810: PARKED. Intentionally stopped on 2026-08-08.
  playwright-chrome:
    image: browserless/chrome:latest
    container_name: playwright-chrome
    restart: unless-stopped
    <<: *default-dns
    profiles: ["parked"]
    labels:
      tsdproxy.enable: "false"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=300000
      - MAX_QUEUE_LENGTH=10
    ports:
      - "3100:3000"
    networks:
      - utility-network

