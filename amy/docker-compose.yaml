#     endpoint is dockerproxy on 10.30.0.12:2375, unauthenticated with a
#     read-only socket. So it cannot start or stop containers, but anyone
#     on the LAN can enumerate them. Acceptable today. It belongs behind a
#     rule when the management VLAN decision lands.
#   - REQUIRED: none. This version records what is already running.
# 20260810 CHANGES (2026-08-10):
#   - CHANGED: version scheme to date-based YYYYMMDD, harmonized with bender.
#     Same-day edits append .2. This completes the change drafted for
#     20260721, which was delivered as a patch script and never applied.
#   - PINNED: keepalived from :latest to osixia/keepalived:2.0.20
#     REASON: parity with bender and determinism. :latest has pointed at
#     2.0.20 for years, so this is a no-op pin that prevents a surprise
#     future move.
#   - ADDED: pihole healthcheck, matching bender's dig-based test.
