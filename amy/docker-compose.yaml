#   - CONFIRMED: the homepage mount change in 20260810 was correct.
#     Host validation had masked the test. Once it passed, the dashboard
#     rendered empty, which proved /docker/homepage/config holds no
#     service definitions. The mount reads /docker/homepage and the tiles
