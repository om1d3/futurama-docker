  # ============================================

  # LOCKED tsdproxy.name: "beszel" - DO NOT CHANGE
  # LOCKED PORT: 8090:8090 - DO NOT CHANGE
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "beszel"
      tsdproxy.container_port: "8090"
      tsdproxy.dash.icon: "sh/beszel-dark"
    volumes:
      - /docker/beszel/data:/beszel_data
    ports:
      - "8090:8090"
    networks:
      - utility-network

  # NOTE: beszel-agent uses network_mode: host, so no DNS config needed
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    labels:
      tsdproxy.enable: "false"
    environment:
      - KEY=${BESZEL_KEY}
      - PORT=45876
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # LOCKED tsdproxy.name: "cadvisor" - DO NOT CHANGE
  # LOCKED PORT: 9099:8080 - DO NOT CHANGE
  # v98: Added resource-saving flags (docker_only, reduced housekeeping, disabled unused metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "cadvisor"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/cadvisor"
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "9099:8080"
    networks:
      - utility-network

  # NOTE: netalertx uses network_mode: host, so no DNS config needed
  # ✅ FIXED 2026-02-02 - Updated volume mount and added required capabilities
  netalertx:
    image: jokobsk/netalertx:latest
    container_name: netalertx
    restart: unless-stopped
    network_mode: host
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "netalertx"
      tsdproxy.container_port: "20211"
      tsdproxy.dash.icon: "sh/netalertx"
    environment:
      - TZ=${TIMEZONE}
      - PORT=20211
    volumes:
      - /docker/netalertx/data:/data
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE

  # v98: Consolidated from /portainer/telegraf/docker-compose.yml
  # Monitors Cisco 3750X switch and Brother MFC-L3710CW printer via SNMP
  # Config: /portainer/telegraf/config/telegraf.conf
  # NOTE: telegraf uses network_mode: host, so no DNS config needed
  # NOTE: that config file is authored and holds SNMP community strings. It
  #   sits outside /docker, so confirm it is inside a backup scope.
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    network_mode: host
    labels:
      tsdproxy.enable: "false"
    volumes:
      - /portainer/telegraf/config/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - TZ=${TIMEZONE}

  # ============================================
  # UPDATE & SECURITY TOOLS
  # ============================================

  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    command: serve
    environment:
      - TZ=${TIMEZONE}
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 4 * * 3
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_NTFY_ENDPOINT=http://ntfy:80
      - DIUN_NOTIF_NTFY_TOPIC=${DIUN_NTFY_TOPIC}
    volumes:
