# 20260809 CHANGES:
#   - ADDED: INFLUXDB_DATA_INDEX_VERSION=tsi1 to influxdb.
#   - REASON: the default in-memory index made startup unusable on this
#     hardware. Measured during the 2026-08-08 migration: a single shard
#     took up to 302 SECONDS to open, and only 29 of 57 shards opened in
#     roughly two hours. The in-memory index is rebuilt at EVERY start, so
#     that cost repeated on every restart, not just the first.
#     With tsi1 the same 58 shards opened in under 10 minutes.
#   - NOTE: the index type is fixed at shard creation. Existing shards keep
#     whatever they were built with. To apply tsi1 the data directory was
#     wiped and the portable backup restored a second time. An in-place
#     alternative exists (influx_inspect buildtsi) if this is ever needed
#     without a restore.
#   - CORRECTION to the 20260807 entry: its REQUIRED list omitted the
#     ownership step, and the first deployment failed on
#     "mkdir /var/lib/influxdb/meta: permission denied".
#     REQUIRED: chown 1500:1500 /mnt/BIG/filme/influxdb
#     The influxdb image runs as uid 1500, NOT 1000 like forgejo.
#     Verify with: docker run --rm influxdb:1.11 id influxdb
#   - NOTE (operational): even with tsi1 this container needs SEVERAL
#     MINUTES to open all shards before it accepts connections. Every
#     restart begins that work from zero. So:
#       * do not casually restart or recreate this service
#       * a bender reboot leaves InfluxDB unavailable for some minutes
#       * the weekly update scan should not treat it as an ordinary container
#   - NOTE (future growth): the default shard duration is 7 days, which is
#     about 52 shards per year. Against the 10-year retention target that
#     reaches roughly 520 shards, and startup time scales with shard count.
#     A longer shard duration on the retention policy would cap this, and it
#     applies to new shards only. OPEN DECISION, not applied here.
#   - MIGRATION COMPLETE (2026-08-08): 2.3 GB of history moved from the Home
#     Assistant InfluxDB add-on (v1.8.10) to this container (v1.11.8) with
#     influxd backup/restore -portable. Home Assistant has written to
#     10.30.0.12 since 09:10 UTC. The add-on has been uninstalled and both
#     transfer copies deleted. Roughly 6.3 GB reclaimed on the Home
#     Assistant VM.
#   - LESSON (recorded deliberately): the cutover appeared to fail for
#     several hours while Home Assistant reported successful writes. The
#     cause was a UI config entry in .storage/core.config_entries titled
#     "homeassistant (10.30.0.41)" which shadowed the influxdb: block in
#     configuration.yaml. The YAML was correct and unread. Deleting the
#     entry fixed it immediately.
#     RULE: verify configuration from the process that consumes it, not
#     from the file you edited. This is the third instance of this fault
#     class in this infrastructure, after the /portainer tsdproxy decoy on
#     amy and the InfluxDB add-on data path.
# 20260818 CHANGES:
#   - ADDED: unifi-db (MongoDB 7.0) and unifi (UniFi Network Application) -
#     the controller for the U7 Pro access point. The access point runs at
#     2.5 Gbps on mom te1/0/20, through a 10Gtek SFP+ RJ45 copper
#     transceiver. Confirmed from the access point itself:
#     "ethtool eth0" reports Speed: 2500Mb/s.
#   - ON DEMAND: both services carry profiles: ["unifi"], therefore a plain
#     "docker compose up -d" leaves them DOWN. Owner decision: the
#     controller runs only while Wi-Fi settings are being changed. An
#     adopted access point keeps serving every SSID while the controller is
#     off; statistics and the client list are lost, the network is not.
#     Same mechanism as amy's six parked services (amy 20260810).
#   - ADDED: scripts/unifi-ctl.sh v1.0 - start, stop, status, and a backup
#     reminder. It checks available memory, refuses to start if
#     init-mongo.sh is missing, waits for the web UI, and prints the
#     inform-host reminder on first start.
#   - IMAGE: linuxserver/unifi-controller is DEPRECATED and gone. The
#     maintained image is unifi-network-application, which REQUIRES an
#     external MongoDB. That is why this is two services and not one.
#   - PINNED: mongo:7.0. It MUST stay pinned - MongoDB does not support
#     automatic upgrades between major versions, and an unpinned tag will
#     refuse to open the data directory after a major bump. Unifi 8.1+
#     supports mongo 3.6 to 7.0; Unifi 9.0+ also supports 8.0.
#   - PINNED: unifi-network-application:9.0.114 rather than :latest, per the
#     policy earned by tsdproxy and oxidized.
#   - AVX: MongoDB above 4.4 needs AVX on x86_64. bender's E3-1265L V2 is
#     Ivy Bridge and HAS avx (verified in /proc/cpuinfo, 2026-08-18). It has
#     no avx2, which mongo does not need. A host without avx is capped at
#     mongo 4.4. Same class of gate as the G-T48E and SSE4.2.
#   - WIREDTIGER CACHE CAPPED: command mongod --wiredTigerCacheSizeGB 0.25.
#     MongoDB otherwise claims half of host RAM minus 1 GB, about 7 GB here.
#     That is precisely the v112 immich OOM failure mode.
#   - RESOURCE LIMITS: unifi mem_limit 1G cpus 1.0; unifi-db mem_limit 768M
#     cpus 0.5. MEM_LIMIT=768 also caps the java heap below its 1024
#     default, because this host runs close to its memory ceiling.
#   - PORT 27017 NOT PUBLISHED, deliberately. LinuxServer's advisory of
#     2024-08-11 notes that without RBAC the official mongo container allows
#     unauthenticated remote access to the database over that port. Only
#     media-network reaches it.
#   - DATA PATH: /mnt/BIG/filme/unifi-db, deliberately OUTSIDE configs/.
#     configs/ is a source in bender-replicate.sh, and rsyncing live
#     WiredTiger files gives an inconsistent copy. Same reasoning as
#     influxdb (20260807) and immich. Protection is ZFS snapshots plus
#     UniFi's own auto-backup, which lands inside configs/unifi.
#   - TSDPROXY: DISABLED deliberately (owner decision). The service is off
#     most of the time, so a tailnet name that is usually dead has no value.
#     LAN access is https://10.30.0.12:8443.
#   - LOCKED PORTS: 8443 (web UI), 8080 (device inform), 3478/udp (STUN),
#     10001/udp (discovery). All four verified free against every other
#     published port in this file. 8080 is the inform port - adoption fails
#     without it. Four optional ports are present but commented: 1900/udp,
#     8843, 8880, 6789.
#   - REQUIRED, in this order:
#       1. mkdir -p /mnt/BIG/filme/unifi-db
#          mkdir -p /mnt/BIG/filme/configs/unifi
#          mkdir -p /mnt/BIG/filme/configs/unifi-db
#       2. place init-mongo.sh in configs/unifi-db/ and chmod 755
#       3. chown -R 1000:1000 /mnt/BIG/filme/configs/unifi
#          chown -R 999:999   /mnt/BIG/filme/unifi-db
#          The mongo image runs as uid 999. The linuxserver image runs as
#          PUID/PGID. Getting this wrong reproduces the 20260809 influxdb
#          "permission denied" failure. Verify: docker run --rm mongo:7.0 id mongodb
#       4. add UNIFI_DB_ROOT_PASSWORD and UNIFI_DB_PASSWORD to .env.
#          Use "openssl rand -hex 24" - the value is injected into a
#          mongodb:// URI, so it must not contain @ : / or $.
#       5. place scripts/unifi-ctl.sh and chmod 755
#       6. scripts/unifi-ctl.sh start
#   - CRITICAL, first start only: the init script runs ONCE, against an EMPTY
#     /data/db. If mongo starts without it, mongo generates test data and the
#     script never runs again. Recovery: stop both, wipe
#     /mnt/BIG/filme/unifi-db/*, put the script in place, start again.
#   - CRITICAL, after first start: set Settings -> System -> Advanced ->
#     Inform Host to 10.30.0.12. The container otherwise advertises its
#     internal docker address, which the access point cannot reach, and
#     adoption fails with no useful error.
#   - NOTE: the access point at 10.30.0.50 needs a DHCP reservation on fry,
#     MAC 8c:ed:e1:84:24:28. Do NOT set a static address on the access point
#     itself; the controller overwrites device network settings on adoption.
#   - NOTE: mom te1/0/20 flapped fifteen times over four minutes while the
#     access point negotiated, then held with zero errors on both sides and
#     no packet loss over 100 pings. Transceiver diagnostics read 3.36 V and
#     36 C, which is nominal, so the earlier power theory was wrong. Watch
#     the flap count after any change to that port.
#   - NOTE: the scheduled auto-backup never runs while the controller is
#     off. Take a manual backup after each change:
#     Settings -> System -> Backup -> Download Backup.
# ============================================
# ✅ VERIFIED WORKING SERVICES - DO NOT MODIFY WITHOUT APPROVAL:
#   - immich_redis (v94: upgraded to redis:7-alpine)
#   - readarr (v94: fixed image to linuxserver/readarr:0.4.19-nightly)
#   - spotdl (v94: fixed image to spotdl/spotify-downloader:latest)
#   - hedgedoc (v94: changed healthcheck to Node.js-based)
#   - immich_server (v94: removed unauthorized healthcheck, v112: resource limits)
#   - vaultwarden (v91: added, moved from amy)
#   - jellyfin (v96: corrected image to lscr.io; v114: pinned 10.11.11)
#   - All services (v93: added DNS anchor, v113: migrated to 10.30.0.2)
#   - immich_machine_learning (v104: python3-based healthcheck, v112: resource limits)
#   - nebula-sync (v104: healthcheck disabled - minimal container)
#   - baikal (v110: CalDAV/CardDAV with PostgreSQL)
#   - vikunja (v111: task management with PostgreSQL; v114: session fix)
# ============================================
# !! IMPORTANT - DO NOT MODIFY TSDPROXY NAMES !!
# These are LOCKED production values.
# ============================================
# !! IMPORTANT - DO NOT MODIFY PORTS !!
# All port mappings are LOCKED production values.
# ============================================

x-dns-config: &default-dns
  dns:
    - 10.30.0.2

services:

  # ============================================
  # INFRASTRUCTURE
  # ============================================

  # LOCKED tsdproxy.name: "bender-proxy" - DO NOT CHANGE
  # LOCKED PORT: 8085:8080 - DO NOT CHANGE
  tsdproxy:
    image: almeidapaulopt/tsdproxy@sha256:e75357d559066a6d0a8242b6d64f8e295adfa6024d3cf1c9a3e3f1ecb00c0bb1
    container_name: tsdproxy
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "bender-proxy"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/tailscale"
    environment:
      - TSDPROXY_AUTHKEY=${TSDPROXY_AUTHKEY}
      - TS_AUTHKEY=${TSDPROXY_AUTHKEY}
      - TSDPROXY_HOSTNAME=${BENDER_HOST_IP}
      - TSDPROXY_DATADIR=/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TSNET_FORCE_LOGIN=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/BIG/filme/configs/tsdproxy/data/tailscale:/data
      - /mnt/BIG/filme/configs/tsdproxy/config:/config
    ports:
      - "8085:8080"
    networks:
      - media-network

  # LOCKED tsdproxy.name: "bender-dockwatch" - DO NOT CHANGE
  # LOCKED PORT: 9999:80 - DO NOT CHANGE
  dockwatch:
    image: ghcr.io/notifiarr/dockwatch:main
    container_name: dockwatch
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "bender-dockwatch"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/docker-dark"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /mnt/BIG/filme/configs/dockwatch:/config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:80"
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Docker Socket Proxy for Homepage on amy
  # !! DO NOT REMOVE - Required for Homepage widget !!
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - VOLUMES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    networks:
      - media-network

  # Diun - Docker Image Update Notifier
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 6 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_NTFY_ENDPOINT=${NTFY_ADDRESS}
      - DIUN_NOTIF_NTFY_TOPIC=${DIUN_NTFY_TOPIC}
      - DIUN_NOTIF_NTFY_PRIORITY=3
      - DIUN_NOTIF_NTFY_TIMEOUT=10s
    volumes:
      - /mnt/BIG/filme/configs/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - media-network

  # Trivy - Container Vulnerability Scanner
  # LOCKED PORT: 8083:8080 - DO NOT CHANGE
  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    command: server --listen 0.0.0.0:8080
    volumes:
      - /mnt/BIG/filme/configs/trivy:/root/.cache/trivy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8083:8080"
    networks:
      - media-network

  # meshcentral - Intel AMT / vPro management plane (browser KVM, power
  # control, serial-over-LAN) for the 10.50.x fleet: zoidberg + the
  # EliteDesks (hermes, kif, zapp, nibbler) once MEBx-provisioned.
  # Fresh install 20260729 (laptop PoC discarded). NeDB built-in database -
  # right-sized for a ~10-device AMT fleet; no postgres tenant, no mongo.
  # meshcentral-data holds AMT credentials -> backup-scope verification item.
  # LOCKED tsdproxy.name: "meshcentral" - DO NOT CHANGE
  # LOCKED PORTS: 8584:80 (redirect), 8585:443 (web/KVM) - DO NOT CHANGE
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:latest
    container_name: meshcentral
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "meshcentral"
      tsdproxy.container_port: "443"
      tsdproxy.dash.icon: "mdi/monitor-eye"
    environment:
      - TZ=${TIMEZONE}
      - HOSTNAME=meshcentral.home.arpa
    volumes:
      - /mnt/BIG/filme/configs/meshcentral/meshcentral-data:/opt/meshcentral/meshcentral-data
      - /mnt/BIG/filme/configs/meshcentral/meshcentral-files:/opt/meshcentral/meshcentral-files
    ports:
      - "8584:80"
      - "8585:443"
    networks:
      - media-network

  # ============================================
  # NETWORK MANAGEMENT - UNIFI
  # ============================================
  # 20260818: UniFi Network Application - controller for the U7 Pro access
  # point on mom te1/0/20 (2.5G through a 10Gtek SFP+ copper transceiver).
  #
  # ON DEMAND BY DESIGN. Both services carry profiles: ["unifi"], therefore
  # a plain "docker compose up -d" leaves them DOWN. Start them only to
  # change Wi-Fi settings, then stop them again:
  #     scripts/unifi-ctl.sh start
  #     scripts/unifi-ctl.sh stop
  # An adopted UniFi access point keeps serving every SSID while the
  # controller is off. You lose statistics and the client list, not the
  # network. The controller IS required for adoption and for any change.
  #
  # THE OLD IMAGE IS DEAD: linuxserver/unifi-controller is deprecated. The
  # maintained image is unifi-network-application, and it REQUIRES an
  # external MongoDB. That is why there are two services here.
  #
  # MONGODB IS PINNED to 7.0 and MUST STAY PINNED. MongoDB does not support
  # automatic upgrades between major versions; an unpinned tag will refuse
  # to open the data directory after a major bump. Unifi 8.1+ supports
  # mongo 3.6 through 7.0. Unifi 9.0+ also supports 8.0.
  #
  # AVX IS REQUIRED for MongoDB above 4.4 on x86_64. bender's E3-1265L V2 is
  # Ivy Bridge, which HAS avx (verified in /proc/cpuinfo, 2026-08-18). It
  # does NOT have avx2, which mongo does not need. If this ever moves to a
  # host without avx, mongo is capped at 4.4.
  #
  # THE INIT SCRIPT RUNS ONCE, ON FIRST START ONLY, against an EMPTY
  # /data/db. It creates the unifi user with dbOwner on four databases plus
  # clusterMonitor. If mongo starts without it, mongo generates test data
  # and you must wipe /mnt/BIG/filme/unifi-db and start again.
  #
  # PORT 27017 IS DELIBERATELY NOT PUBLISHED. LinuxServer's own advisory
  # (2024-08-11) notes that without RBAC the official mongo container allows
  # unauthenticated remote access to the database over that port. Only the
  # media-network reaches it.
  #
  # DATA PATH: /mnt/BIG/filme/unifi-db, deliberately OUTSIDE configs/, for
  # the same reason as influxdb and immich. configs/ is a source in
  # bender-replicate.sh, and rsyncing live WiredTiger files produces an
  # inconsistent copy. Protection is ZFS snapshots, plus UniFi's own
  # auto-backup which lands inside configs/unifi.
  #
  # WIREDTIGER CACHE IS CAPPED EXPLICITLY. MongoDB defaults to half of host
  # RAM minus 1 GB, which on this 16 GB host is about 7 GB. That is exactly
  # the v112 immich failure mode. 0.25 GB is ample for a one-access-point
  # site.
  #
  # OWNERSHIP DIFFERS BETWEEN THE TWO. The linuxserver image runs as
  # PUID/PGID. The official mongo image runs as uid 999. Getting this wrong
  # reproduces the 20260809 influxdb "permission denied" failure.
  #   chown -R 1000:1000 /mnt/BIG/filme/configs/unifi
  #   chown -R 999:999   /mnt/BIG/filme/unifi-db
  #   Verify with: docker run --rm mongo:7.0 id mongodb
  #
  # TSDPROXY: DISABLED deliberately (owner decision). The service is off
  # most of the time, so a tailnet name that is usually dead has no value.
  # Reach it at https://10.30.0.12:8443 when it is running.
  #
  # AFTER FIRST START you MUST set the inform host, or adoption fails:
  #   Settings -> System -> Advanced -> Inform Host = 10.30.0.12
  # The container otherwise advertises its internal docker address, which
  # the access point cannot reach.
  #
  # LOCKED PORTS: 8443, 8080, 3478/udp, 10001/udp - DO NOT CHANGE
  # 8080 is the device inform port. Adoption fails without it.
  unifi-db:
    image: mongo:7.0
    container_name: unifi-db
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${UNIFI_DB_ROOT_PASSWORD}
      # read by init-mongo.sh on first start only
      - MONGO_USER=unifi
      - MONGO_PASS=${UNIFI_DB_PASSWORD}
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
    volumes:
      - /mnt/BIG/filme/unifi-db:/data/db
      - /mnt/BIG/filme/configs/unifi-db/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    networks:
      - media-network
    # cap the WiredTiger cache: the default would claim ~7 GB on this host
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 768M
    cpus: 0.5
    profiles:
      - unifi
  unifi:
    image: lscr.io/linuxserver/unifi-network-application:9.0.114
    container_name: unifi
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_USER=unifi
      - MONGO_PASS=${UNIFI_DB_PASSWORD}
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
      # java heap, in MB. Lower than the 1024 default: this host is tight.
      - MEM_LIMIT=768
      - MEM_STARTUP=256
    volumes:
      - /mnt/BIG/filme/configs/unifi:/config
    ports:
      # web UI, HTTPS with a self-signed certificate
      - "8443:8443"
      # device inform - REQUIRED for adoption
      - "8080:8080"
      # STUN, keeps devices reachable
      - "3478:3478/udp"
      # access point discovery
      - "10001:10001/udp"
      # optional, enable only if needed:
      #   - "1900:1900/udp"   L2 discovery from the UniFi mobile app
      #   - "8843:8843"       guest portal HTTPS
      #   - "8880:8880"       guest portal HTTP
      #   - "6789:6789"       mobile speed test
    networks:
      - media-network
    depends_on:
      - unifi-db
    mem_limit: 1G
    cpus: 1.0
    profiles:
      - unifi
  # ============================================
  # VPN - GLUETUN (Surfshark OpenVPN)
  # ============================================
  # v97: Added for centralized VPN management
  # v98: Changed from OpenVPN to WireGuard
  # v100: Added DOT=off for DNS troubleshooting
  # v103: Restored port 9091:9091 for Transmission
  # v104: Changed back from WireGuard to OpenVPN (WireGuard blocked peer connections)
  # v106: Improved healthcheck (IP-based) + autoheal for stale VPN auto-restart
  # ============================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
      # v106: autoheal will restart this container when healthcheck fails
      autoheal: "true"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TIMEZONE}
      - VPN_SERVICE_PROVIDER=surfshark
      # v104: Changed from wireguard to openvpn (WireGuard blocked peer connections)
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${SURFSHARK_OPENVPN_USER}
      - OPENVPN_PASSWORD=${SURFSHARK_OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${GLUETUN_SERVER_COUNTRY}
    volumes:
      - /mnt/BIG/filme/configs/gluetun:/gluetun
    ports:
      # Transmission (v103: restored from qBittorrent)
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
      # Prowlarr
      - "9696:9696"
      # Sonarr
      - "8989:8989"
      # Radarr
      - "7878:7878"
      # Lidarr
      - "8686:8686"
      # Readarr
      - "8787:8787"
      # Bazarr
      - "6767:6767"
      # JDownloader
      - "5800:5800"
    networks:
      - media-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=5 'http://1.1.1.1/cdn-cgi/trace' 2>/dev/null | grep -q 'warp='"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # v106: Auto-restart unhealthy containers (targets gluetun stale VPN sessions)
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    labels:
      tsdproxy.enable: "false"
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=60
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ============================================
  # DNS & HIGH AVAILABILITY
  # ============================================

  # LOCKED tsdproxy.name: "pihole-bender" - DO NOT CHANGE
  # LOCKED PORTS: 53, 8053 - DO NOT CHANGE
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "pihole-bender"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/pi-hole"
    environment:
      - TZ=${TIMEZONE}
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - FTLCONF_LOCAL_IPV4=${BENDER_HOST_IP}
      - PIHOLE_DNS_=1.1.1.1;8.8.8.8
      - DNSMASQ_LISTENING=all
    volumes:
      - /mnt/BIG/filme/configs/pihole/etc-pihole:/etc/pihole
      - /mnt/BIG/filme/configs/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80"
    networks:
      - media-network
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "dig", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Keepalived - VIP Failover (MASTER)
  # v113: KEEPALIVED_INTERFACE updated from enp4s0 to ens1f0 (new 10G NIC)
  keepalived:
    image: osixia/keepalived:2.0.20
    container_name: keepalived
    restart: unless-stopped
    environment:
      - KEEPALIVED_INTERFACE=ens1f0
      - KEEPALIVED_PASSWORD=${KEEPALIVED_PASSWORD}
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    network_mode: host
    volumes:
      - /mnt/BIG/filme/configs/keepalived/keepalived.conf:/container/service/keepalived/assets/keepalived.conf:ro
    command: --copy-service

  # ✅ VERIFIED WORKING 2026-02-01 - DO NOT MODIFY WITHOUT APPROVAL
  # v104 FIX: Healthcheck disabled (minimal container has no binaries)
  # v113: PRIMARY updated to 10.30.0.12, REPLICAS updated to 10.30.0.11 (amy)
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    container_name: nebula-sync
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
      - "PRIMARY=http://10.30.0.12:8053|${PIHOLE_PASSWORD}"
      - "REPLICAS=http://10.30.0.11:8053|${PIHOLE_PASSWORD}"
      - FULL_SYNC=true
      - RUN_GRAVITY=true
      - CRON=0 * * * *
    networks:
      - media-network
    healthcheck:
      disable: true

  # ============================================
  # DATABASES & CACHE
  # ============================================

  # CRITICAL: This database contains your Immich photos metadata!
  postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: postgres
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - /mnt/BIG/filme/immich/postgresql:/var/lib/postgresql/data
      - /mnt/BIG/filme/configs/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - media-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immich"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries=vchord.so,vectors.so
      -c 'search_path="$$user", public, vectors'
      -c max_wal_size=2GB
      -c shared_buffers=512MB
      -c wal_compression=on

  # !! DO NOT REMOVE - Daily PostgreSQL backups !!
  # 20260721: pinned :latest -> :14 - major-matched to the postgres 14 server
  #       (restore-compatibility convention adopted from amy's :17 pin).
  #       Bump this tag in the SAME change as any future postgres major upgrade.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:14
    container_name: postgres-backup
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=immich,hedgedoc,baikal,vikunja,forgejo
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - /mnt/BIG/filme/backups/postgres:/backups
    networks:
      - media-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  immich_redis:
