#     in this file.
#   - TSDPROXY: DISABLED deliberately (owner decision). This is a database,
#     not a web service. It stays on the LAN and inside the tailnet only
#     through bender itself.
#   - DATA PATH: /mnt/BIG/filme/influxdb - NOT under configs/. Reason:
#     /mnt/BIG/filme/configs is a source in bender-replicate.sh, and ten
