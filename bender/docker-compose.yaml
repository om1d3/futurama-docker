# ============================================
# bender (TrueNAS Scale) - Media & Downloads
# Version: 105 - Added cAdvisor for Grafana monitoring
# ============================================
# Host: TrueNAS Scale (HP MicroServer Gen8)
# CPU: Intel Xeon E3-1265L V2 (iGPU disabled by HP BIOS)
# IP: 192.168.21.121
# Data path: /mnt/BIG/filme/
# Config path: /mnt/BIG/filme/configs/
# ============================================
# CRITICAL: postgres volume uses /mnt/BIG/filme/immich/postgresql
#           which contains your actual Immich database
# ============================================
# v90.8 CHANGES:
#   - FIXED: nebula-sync quote placement
#   - COMMENTED: playwright-chrome for future arr stack configuration
# v92 CHANGES (2026-01-19):
#   - ADDED: vaultwarden (moved from amy)
#   - REMOVED: vaultwarden from amy
#   - REQUIRED: Add VAULTWARDEN_ADMIN_TOKEN to bender .env file
# v93 CHANGES (2026-01-19):
#   - ADDED dns: 192.168.21.100 to all services on media-network
#   - Uses keepalived VIP for local DNS resolution
#   - Synced version number with amy-docker-compose.yaml
# v94 CHANGES (2026-01-20):
#   - UPGRADED immich_redis from redis:6.2-alpine to redis:7-alpine
#   - Fixes "Can't handle RDB format version 11" error
# v96 CHANGES (2026-01-20):
#   - ADDED verification comments to all fixed services
#   - Skipped v95 to sync with amy version numbering
# v96 FIX (2026-01-22):
#   - CORRECTED jellyfin image from jellyfin/jellyfin:latest to lscr.io/linuxserver/jellyfin:latest
# v97 CHANGES (2026-01-22):
#   - ADDED: gluetun VPN container for ARR stack + transmission
#   - CHANGED: transmission from haugene/transmission-openvpn to linuxserver/transmission via gluetun
#   - CHANGED: prowlarr, sonarr, radarr, lidarr, readarr, bazarr, jdownloader now route through gluetun
#   - REQUIRED: Add GLUETUN_SERVER_COUNTRY to .env file
#   - REQUIRED: Add SURFSHARK_WG_PRIVATE_KEY and SURFSHARK_WG_ADDRESS to .env file
# v98 CHANGES (2026-01-22):
#   - CHANGED: gluetun VPN_TYPE from openvpn to wireguard
# v99 CHANGES (2026-01-24):
#   - ADDED: TRANSMISSION_BIND_ADDRESS_IPV4=0.0.0.0 to transmission
#   - ADDED: Flood UI and env-var-settings mods to transmission
# v100 CHANGES (2026-01-24):
#   - ADDED: DOT=off to gluetun (EXPERIMENTAL - revert to DOT=on after testing)
#   - ADDED: postgres shared_preload_libraries=vchord.so,vectors.so for backups
# v101 CHANGES (2026-01-25):
#   - RESTORED: v96 base configuration (v100 was corrupted)
#   - RESTORED: pihole tsdproxy.name=pihole-bender
#   - RESTORED: keepalived proper config with KEEPALIVED_INTERFACE and --copy-service
#   - RESTORED: nebula-sync PRIMARY/REPLICAS format
#   - RESTORED: all healthchecks that were removed
#   - KEPT: approved gluetun/transmission/ARR changes from v97-v100
# v102 CHANGES (2026-01-25):
#   - REPLACED: Transmission with qBittorrent (FileList client whitelist requirement)
#   - COMMENTED: Transmission container (kept for potential future use)
#   - CHANGED: gluetun port 9091 now maps to qBittorrent 8080
#   - CHANGED: tsdproxy.name from "transmission" to "qbittorrent"
# v103 CHANGES (2026-01-25):
#   - REVERTED: qBittorrent back to Transmission (qBittorrent caused repeated system crashes)
#   - PINNED: Transmission to version 4.0.5 (FileList whitelist - DO NOT UPGRADE!)
#   - RESTORED: gluetun port mapping to 9091:9091
#   - RESTORED: tsdproxy.name to "transmission"
#   - COMMENTED: qBittorrent container (incompatible with HP MicroServer Gen8 ZFS I/O)
#   - WARNING: Transmission 4.0.6+ is NOT on FileList whitelist!
# v104 CHANGES (2026-01-25):
#   - CHANGED: gluetun VPN_TYPE from wireguard to openvpn
#   - REASON: WireGuard was blocking outbound peer connections on all Surfshark servers
#   - REMOVED: WIREGUARD_PRIVATE_KEY and WIREGUARD_ADDRESSES
#   - ADDED: OPENVPN_USER and OPENVPN_PASSWORD
#   - REQUIRED: Add SURFSHARK_OPENVPN_USER and SURFSHARK_OPENVPN_PASSWORD to .env file
# v104 HEALTHCHECK FIX (2026-02-01):
#   - FIXED: immich_machine_learning healthcheck now uses python3 (curl not available)
#   - FIXED: nebula-sync healthcheck disabled (minimal container has no binaries)
# v105 CHANGES (2026-02-07):
#   - ADDED: cAdvisor for container resource monitoring (CPU, memory, I/O)
#   - Scraped by Prometheus on Home Assistant VM for Grafana dashboard
#   - Port 9099:8080 (matching amy's cAdvisor port)
#   - ADDED: /data/tvshows volume mount to jellyfin (maps to same seriale directory as /data/tv)
#   - REMOVED: duplicate /data/tv volume mount from jellyfin (tvshows is the active library path)
#   - Fixes "Access to path /data/tvshows is denied" and missing image errors
# ============================================
# ✅ VERIFIED WORKING SERVICES - DO NOT MODIFY WITHOUT APPROVAL:
#   - immich_redis (v94: upgraded to redis:7-alpine)
#   - readarr (v94: fixed image to linuxserver/readarr:0.4.19-nightly)
#   - spotdl (v94: fixed image to spotdl/spotify-downloader:latest)
#   - hedgedoc (v94: changed healthcheck to Node.js-based)
#   - immich_server (v94: removed unauthorized healthcheck)
#   - vaultwarden (v91: added, moved from amy)
#   - jellyfin (v96: corrected image to lscr.io/linuxserver/jellyfin:latest)
#   - All services (v93: added DNS anchor 192.168.21.100)
#   - immich_machine_learning (v104: python3-based healthcheck)
#   - nebula-sync (v104: healthcheck disabled - minimal container)
# ============================================
# !! IMPORTANT - DO NOT MODIFY TSDPROXY NAMES !!
# These are LOCKED production values.
# ============================================
# !! IMPORTANT - DO NOT MODIFY PORTS !!
# All port mappings are LOCKED production values.
# ============================================

x-dns-config: &default-dns
  dns:
    - 192.168.21.100

services:

  # ============================================
  # INFRASTRUCTURE
  # ============================================

  # LOCKED tsdproxy.name: "bender-proxy" - DO NOT CHANGE
  # LOCKED PORT: 8085:8080 - DO NOT CHANGE
  tsdproxy:
    image: almeidapaulopt/tsdproxy:latest
    container_name: tsdproxy
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "bender-proxy"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/tailscale"
    environment:
      - TSDPROXY_AUTHKEY=${TSDPROXY_AUTHKEY}
      - TSDPROXY_HOSTNAME=${BENDER_HOST_IP}
      - TSDPROXY_DATADIR=/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/BIG/filme/configs/tsdproxy/data/tailscale:/data
      - /mnt/BIG/filme/configs/tsdproxy/config:/config
    ports:
      - "8085:8080"
    networks:
      - media-network

  # LOCKED tsdproxy.name: "bender-dockwatch" - DO NOT CHANGE
  # LOCKED PORT: 9999:80 - DO NOT CHANGE
  dockwatch:
    image: ghcr.io/notifiarr/dockwatch:main
    container_name: dockwatch
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "bender-dockwatch"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/docker"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /mnt/BIG/filme/configs/dockwatch:/config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:80"
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Docker Socket Proxy for Homepage on amy
  # !! DO NOT REMOVE - Required for Homepage widget !!
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - VOLUMES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    networks:
      - media-network

  # Diun - Docker Image Update Notifier
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 6 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_NTFY_ENDPOINT=${NTFY_ADDRESS}
      - DIUN_NOTIF_NTFY_TOPIC=${DIUN_NTFY_TOPIC}
      - DIUN_NOTIF_NTFY_PRIORITY=3
      - DIUN_NOTIF_NTFY_TIMEOUT=10s
    volumes:
      - /mnt/BIG/filme/configs/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - media-network

  # Trivy - Container Vulnerability Scanner
  # LOCKED PORT: 8083:8080 - DO NOT CHANGE
  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    command: server --listen 0.0.0.0:8080
    volumes:
      - /mnt/BIG/filme/configs/trivy:/root/.cache/trivy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8083:8080"
    networks:
      - media-network

  # ============================================
  # VPN - GLUETUN (Surfshark OpenVPN)
  # ============================================
  # v97: Added for centralized VPN management
  # v98: Changed from OpenVPN to WireGuard
  # v100: Added DOT=off for DNS troubleshooting
  # v103: Restored port 9091:9091 for Transmission
  # v104: Changed back from WireGuard to OpenVPN (WireGuard blocked peer connections)
  # ============================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TIMEZONE}
      - VPN_SERVICE_PROVIDER=surfshark
      # v104: Changed from wireguard to openvpn (WireGuard blocked peer connections)
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${SURFSHARK_OPENVPN_USER}
      - OPENVPN_PASSWORD=${SURFSHARK_OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${GLUETUN_SERVER_COUNTRY}
      # DOT=off disables DNS-over-TLS, using plain DNS instead
      - DOT=off
    volumes:
      - /mnt/BIG/filme/configs/gluetun:/gluetun
    ports:
      # Transmission (v103: restored from qBittorrent)
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
      # Prowlarr
      - "9696:9696"
      # Sonarr
      - "8989:8989"
      # Radarr
      - "7878:7878"
      # Lidarr
      - "8686:8686"
      # Readarr
      - "8787:8787"
      # Bazarr
      - "6767:6767"
      # JDownloader
      - "5800:5800"
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://ipinfo.io"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # DNS & HIGH AVAILABILITY
  # ============================================

  # Pi-hole - Primary DNS Server (MASTER)
  # LOCKED tsdproxy.name: "pihole-bender" - DO NOT CHANGE
  # LOCKED PORTS: 53, 8053 - DO NOT CHANGE
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "pihole-bender"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/pi-hole"
    environment:
      - TZ=${TIMEZONE}
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - FTLCONF_LOCAL_IPV4=${BENDER_HOST_IP}
      - PIHOLE_DNS_=1.1.1.1;8.8.8.8
      - DNSMASQ_LISTENING=all
    volumes:
      - /mnt/BIG/filme/configs/pihole/etc-pihole:/etc/pihole
      - /mnt/BIG/filme/configs/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80"
    networks:
      - media-network
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "dig", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Keepalived - VIP Failover (MASTER)
  # Provides VIP 192.168.21.100 that floats between bender and amy
  # bender is MASTER (priority 150), amy is BACKUP (priority 100)
  keepalived:
    image: osixia/keepalived:2.0.20
    container_name: keepalived
    restart: unless-stopped
    environment:
      - KEEPALIVED_INTERFACE=enp4s0
      - KEEPALIVED_PASSWORD=${KEEPALIVED_PASSWORD}
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    network_mode: host
    volumes:
      - /mnt/BIG/filme/configs/keepalived/keepalived.conf:/container/service/keepalived/assets/keepalived.conf:ro
    command: --copy-service

  # ✅ VERIFIED WORKING 2026-02-01 - DO NOT MODIFY WITHOUT APPROVAL
  # v104 FIX: Healthcheck disabled (minimal container has no binaries)
  # Nebula-sync - Pi-hole Configuration Sync
  # Syncs from bender (primary) to amy (replica)
  # v84 FIX: Wrapped PRIMARY/REPLICAS in quotes for pipe character
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    container_name: nebula-sync
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
      - "PRIMARY=http://192.168.21.121:8053|${PIHOLE_PASSWORD}"
      - "REPLICAS=http://192.168.21.130:8053|${PIHOLE_PASSWORD}"
      - FULL_SYNC=true
      - RUN_GRAVITY=true
      - CRON=0 * * * *
    networks:
      - media-network
    healthcheck:
      disable: true

  # ============================================
  # DATABASES & CACHE
  # ============================================

  # PostgreSQL - Shared database for Immich and HedgeDoc
  # CRITICAL: This database contains your Immich photos metadata!
  # v100: Added shared_preload_libraries for vchord.so
  postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: postgres
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - /mnt/BIG/filme/immich/postgresql:/var/lib/postgresql/data
      - /mnt/BIG/filme/configs/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - media-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immich"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries=vchord.so,vectors.so
      -c 'search_path="$$user", public, vectors'
      -c max_wal_size=2GB
      -c shared_buffers=512MB
      -c wal_compression=on

  # !! DO NOT REMOVE - Daily PostgreSQL backups !!
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:latest
    container_name: postgres-backup
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=immich,hedgedoc
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - /mnt/BIG/filme/backups/postgres:/backups
    networks:
      - media-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v94: upgraded from redis:6.2-alpine to redis:7-alpine
  # Fixes "Can't handle RDB format version 11" error
  immich_redis:
    image: redis:7-alpine
    container_name: immich_redis
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    volumes:
      - /mnt/BIG/filme/immich/redis:/data
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # IMMICH - Photo Management
  # ============================================

  # ✅ VERIFIED WORKING 2026-01-20 - DO NOT MODIFY WITHOUT APPROVAL
  # v94: removed unauthorized healthcheck (uses image built-in)
  # LOCKED tsdproxy.name: "photo" - DO NOT CHANGE
  # LOCKED PORT: 2283:2283 - DO NOT CHANGE
  immich_server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "photo"
      tsdproxy.container_port: "2283"
      tsdproxy.dash.icon: "sh/immich"
    environment:
      - DB_HOSTNAME=postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich_redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich_machine_learning:3003
      - TZ=${TIMEZONE}
    volumes:
      - /mnt/BIG/filme/immich/photos:/usr/src/app/upload
    ports:
      - "2283:2283"
    networks:
      - media-network
    depends_on:
      - postgres
      - immich_redis

  # ✅ VERIFIED WORKING 2026-02-01 - DO NOT MODIFY WITHOUT APPROVAL
  # v104 FIX: Changed healthcheck to use python3 (curl not available in this container)
  immich_machine_learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - /mnt/BIG/filme/immich/ml-cache:/cache
    networks:
      - media-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('localhost',3003); c.request('GET','/ping'); r=c.getresponse(); exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # MEDIA SERVERS
  # ============================================

  # ✅ VERIFIED WORKING 2026-01-22 - DO NOT MODIFY WITHOUT APPROVAL
  # v96 FIX: Corrected image to lscr.io/linuxserver/jellyfin:latest
  # LOCKED tsdproxy.name: "media" - DO NOT CHANGE
  # LOCKED PORT: 8096:8096 - DO NOT CHANGE
  # GPU devices commented out - iGPU disabled in HP BIOS
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "media"
      tsdproxy.container_port: "8096"
      tsdproxy.dash.icon: "sh/jellyfin"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /mnt/BIG/filme/configs/jellyfin:/config
      - /mnt/BIG/filme/filme:/data/movies
      - /mnt/BIG/filme/seriale:/data/tvshows
      - /mnt/BIG/filme/music:/data/music
    # !! KEEP FOR FUTURE USE - GPU HARDWARE ACCELERATION !!
    # HP MicroServer Gen8 iGPU is disabled in BIOS (no modded BIOS available)
    # Uncomment when/if GPU becomes available:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "44"
    #   - "109"
    ports:
      - "8096:8096"
    networks:
      - media-network

  # LOCKED tsdproxy.name: "books" - DO NOT CHANGE
  # LOCKED PORT: 8081:80 - DO NOT CHANGE
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "books"
      tsdproxy.container_port: "80"
      tsdproxy.dash.icon: "sh/audiobookshelf"
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - /mnt/BIG/filme/configs/audiobookshelf:/config
      - /mnt/BIG/filme/audiobookshelf/audiobooks:/audiobooks
      - /mnt/BIG/filme/audiobookshelf/podcasts:/podcasts
      - /mnt/BIG/filme/audiobookshelf/metadata:/metadata
    ports:
      - "8081:80"
    networks:
      - media-network

  # ============================================
  # DOWNLOAD CLIENTS
  # ============================================

  # v103: RESTORED Transmission 4.0.5 (qBittorrent caused system crashes)
  # !! PINNED TO 4.0.5 - DO NOT UPGRADE !!
  # Transmission 4.0.6+ is NOT on FileList whitelist!
  # LOCKED tsdproxy.name: "transmission" - DO NOT CHANGE
  # LOCKED PORT: 9091:9091 (exposed via gluetun) - DO NOT CHANGE
  transmission:
    image: lscr.io/linuxserver/transmission:4.0.5
    container_name: transmission
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "transmission"
      tsdproxy.container_port: "9091"
      tsdproxy.dash.icon: "sh/transmission"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - DOCKER_MODS=linuxserver/mods:transmission-floodui|linuxserver/mods:transmission-env-var-settings
      - TRANSMISSION_DOWNLOAD_DIR=/data/completed
      - TRANSMISSION_INCOMPLETE_DIR=/data/incomplete
      - TRANSMISSION_WATCH_DIR=/data/watch
      - TRANSMISSION_BIND_ADDRESS_IPV4=0.0.0.0
    volumes:
      - /mnt/BIG/filme/transmission/config/transmission-home:/config
