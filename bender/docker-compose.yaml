    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 20260807: InfluxDB 1.x - long-term time-series store for Home Assistant.
  #
  # WHY IT LIVES HERE: the Home Assistant VM has a 109 GB disk and already
  # needed a resize this week. Ten years of telemetry belongs on the storage
  # host, not on an application VM. This is a MOVE of the add-on database,
  # not a mirror - one copy, one truth.
  #
  # VERSION: 1.x is REQUIRED. Home Assistant's influxdb: block uses
  # database/username/password, which is the 1.x API. A 2.x server needs
  # bucket/org/token instead. Do not "upgrade" this pin without rewriting
  # the Home Assistant configuration in the same change.
  #
  # DATA PATH: /mnt/BIG/filme/influxdb, deliberately OUTSIDE configs/,
  # because configs/ is a source in bender-replicate.sh. Telemetry does not
  # belong in the nightly config replica to amy. Protection is ZFS snapshots.
  #
  # RETENTION: the default autogen policy is INFINITE. That is intended and
  # matches the 10-year recorder target already set in Home Assistant.
  #
  # OWNERSHIP: the data directory must be owned by uid 1500, not 1000.
  # chown 1500:1500 /mnt/BIG/filme/influxdb
  #
  # STARTUP: this container needs SEVERAL MINUTES to open its shards before
  # it accepts connections, and every restart repeats that work. Do not
  # casually recreate it.
  #
  # TSDPROXY: disabled on purpose. This is a database, not a web service.
  #
  # LOCKED PORT: 8086:8086 - DO NOT CHANGE
  influxdb:
    image: influxdb:1.11
    container_name: influxdb
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
      - INFLUXDB_DB=homeassistant
      - INFLUXDB_HTTP_AUTH_ENABLED=true
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_USER=hass
      - INFLUXDB_USER_PASSWORD=${INFLUXDB_USER_PASSWORD}
      - INFLUXDB_REPORTING_DISABLED=true
      # 20260809: disk-based index. Without it, startup takes HOURS.
      - INFLUXDB_DATA_INDEX_VERSION=tsi1
    volumes:
      - /mnt/BIG/filme/influxdb:/var/lib/influxdb
    ports:
      - "8086:8086"
    networks:
      - media-network
    mem_limit: 2G
    cpus: 1.0

