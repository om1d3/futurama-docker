      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /mnt/BIG/filme/configs/bazarr:/config
      - /mnt/BIG/filme/filme:/movies
      - /mnt/BIG/filme/seriale:/tv
    network_mode: "service:gluetun"
    depends_on:
      - gluetun

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
      - UN_SONARR_0_URL=http://gluetun:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://gluetun:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_LIDARR_0_URL=http://gluetun:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY}
      - UN_READARR_0_URL=http://gluetun:8787
      - UN_READARR_0_API_KEY=${READARR_API_KEY}
    volumes:
      - /mnt/BIG/filme/transmission:/downloads
    networks:
      - media-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - TZ=${TIMEZONE}
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    networks:
      - media-network

  # ============================================
  # TEXT-TO-SPEECH - Audiobook Generation
  # ============================================

  # v108: Edge TTS API - OpenAI-compatible neural TTS endpoint
  # LOCKED PORT: 5050:5050 - DO NOT CHANGE
  edge-tts:
    image: travisvn/openai-edge-tts:latest
    container_name: edge-tts
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    environment:
      - DEFAULT_VOICE=ro-RO-AlinaNeural
      - DEFAULT_RESPONSE_FORMAT=mp3
      - DEFAULT_SPEED=1.0
      - REQUIRE_API_KEY=False
    ports:
      - "5050:5050"
    networks:
      - media-network
    mem_limit: 512M
    cpus: 0.6

  # v108: epub2tts-edge - on-demand manual converter (profiles:tools)
  epub2tts-edge:
    build:
      context: /mnt/BIG/filme/configs/epub2tts-edge
      dockerfile: Dockerfile
    container_name: epub2tts-edge
    <<: *default-dns
    labels:
      tsdproxy.enable: "false"
    volumes:
      - /mnt/BIG/filme/audiobookshelf/audiobooks:/audiobooks
      - /mnt/BIG/filme/tts/input:/input
    networks:
      - media-network
    mem_limit: 4G
    cpus: 0.6
    profiles:
      - tools

  # audiobook-foundry - published pipeline, lineage tts-pipeline (v108) ->
  # lrrr (v113) -> audiobook-foundry (20260729, full rename).
  # Build context is the git checkout; configuration is env-driven
  # (AF_*); the pipeline now sanitizes oversized M4B metadata tags (ShelfDroid
  # 2 MB CursorWindow fix). Voice directories unchanged (repo defaults = v109):
  #   /input/ro-emil  -> ro-RO-EmilNeural    /input/ro-alina -> ro-RO-AlinaNeural
  #   /input/en-ryan  -> en-GB-RyanNeural    /input/en-sonia -> en-GB-SoniaNeural
  # LOCKED tsdproxy.name: "tts" - DO NOT CHANGE
  # LOCKED PORT: 5051:5051 - DO NOT CHANGE
  audiobook-foundry:
    build:
      context: /mnt/BIG/filme/configs/audiobook-foundry
      dockerfile: Dockerfile
    container_name: audiobook-foundry
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "tts"
      tsdproxy.container_port: "5051"
      tsdproxy.dash.icon: "mdi/microphone"
    environment:
      - TZ=${TIMEZONE}
      - NTFY_URL=http://10.30.0.11:8888/tts-pipeline
      # library-path parity with v109 (the repo default is /audiobooks)
      - AF_OUTPUT_DIR=/audiobooks/cărți
      # other knobs (AF_VOICES, AF_MAX_DESCRIPTION_CHARS=4000,
      # AF_CHAPTER_WARN=200, AF_PORT=5051) ride on repo defaults
    volumes:
      - /mnt/BIG/filme/tts/input:/input
      - /mnt/BIG/filme/audiobookshelf/audiobooks:/audiobooks
    ports:
      - "5051:5051"
    networks:
      - media-network
    mem_limit: 4G
    cpus: 0.6

  # ============================================
  # UTILITIES
  # ============================================

  # LOCKED tsdproxy.name: "sync" - DO NOT CHANGE
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: ${SYNCTHING_HOSTNAME}
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "sync"
      tsdproxy.container_port: "8384"
      tsdproxy.dash.icon: "sh/syncthing"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /mnt/BIG/filme/syncthing:/var/syncthing
    network_mode: host
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3

  # !! DO NOT REMOVE - Keep for future re-enablement !!
  # playwright-chrome:
  #   image: dgtlmoon/sockpuppetbrowser:latest
  #   container_name: playwright-chrome
  #   restart: unless-stopped
  #   <<: *default-dns
  #   labels:
  #     tsdproxy.enable: "false"
  #   environment:
  #     - SCREEN_WIDTH=1920
  #     - SCREEN_HEIGHT=1080
  #     - SCREEN_DEPTH=16
  #     - MAX_CONCURRENT_CHROME_PROCESSES=10
  #   networks:
  #     - media-network
  #   mem_limit: 1024M
  #   cpus: 1.5

  # ============================================
  # MONITORING
  # ============================================

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    labels:
      tsdproxy.enable: "false"
    environment:
      - KEY=${BESZEL_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: host

  # LOCKED PORT: 9099:8080 - DO NOT CHANGE
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    <<: *default-dns
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "bender-cadvisor"
      tsdproxy.container_port: "8080"
      tsdproxy.dash.icon: "sh/cadvisor"
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "9099:8080"
    networks:
      - media-network

# ============================================
# NETWORKS
# ============================================

networks:
  media-network:
    driver: bridge
