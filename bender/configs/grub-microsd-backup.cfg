		else
		  search --no-floppy --fs-uuid --set=root a8c67a69957f6624
		fi
		echo	'Loading Linux 6.12.33-debug+truenas ...'
		linux	/ROOT/25.10.1@/boot/vmlinuz-6.12.33-debug+truenas root=ZFS=boot-pool/ROOT/25.10.1 ro  libata.allow_tpm=1 amd_iommu=on iommu=pt kvm_amd.npt=1 kvm_amd.avic=1 intel_iommu=off zfsforce=1 nvme_core.multipath=N
